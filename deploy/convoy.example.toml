# ConvoyChat bridge identity — lives at /boot/convoy.toml on each Pi (INV-11).
# Everything except [node] id has a working default.

[node]
id = "r2_rider"             # must match a rider id in the base's roster.yaml
base = "192.168.1.2"        # the chase-car base station (mixer + control)
# down_port = 6104          # normally taken from the roster: 6100 + 2*index
# speed_kmh = 0             # static wind estimate for the HPF until GPS lands

[audio]
# Raw s16le / 16 kHz / mono on a pipe. PipeWire (RPi OS Bookworm) shown;
# bluez-alsa alternative: "arecord -q -D bluealsa:DEV=<mac>,PROFILE=sco -f S16_LE -r 16000 -c 1 -t raw -"
source_cmd = "pw-record --rate 16000 --channels 1 --format s16 --latency 60ms -"
sink_cmd   = "pw-play --rate 16000 --channels 1 --format s16 --latency 60ms -"
prefer_silero = true        # false = energy VAD only (saves ~15% CPU on a 3A+)

[bt]
headset_mac = ""            # set by `bridgectl pair` or the rider page; blank = unpaired

[wifi]
iface = "wlan0"             # 5 GHz USB adapter (INV-4); onboard is 2.4 only

[actions]
enabled = false             # true on a real bike: reboot/reconnect shells actually run

[net]
node_token = ""             # if the roster sets net.node_token, must match

[radio]                     # wired HT fallback (DR-011): the helmet moves to RF when the base is gone
mode = "off"                # off | auto | always ("always" = a licensed rider relaying the room)
callsign = ""               # REQUIRED to transmit; the link never keys without one
service = "ham"             # ham (ID every 10 min) | gmrs (every 15 min)
ptt = "gpio:17"             # gpio:<pin>[:low] | serial:/dev/ttyUSB0:rts | none
rx_cmd = "arecord -q -D plughw:1,0 -f S16_LE -r 16000 -c 1 -t raw -"   # rig speaker -> Pi
tx_cmd = "aplay -q -D plughw:1,0 -f S16_LE -r 16000 -c 1 -t raw -"     # Pi -> rig mic
hang_ms = 600
tot_s = 180                 # time-out timer (seconds keyed) before a forced unkey

[failover]                  # hotspot + WireGuard when the convoy Wi-Fi is gone (DR-012)
enabled = false
star_ssid = "convoy"
hotspots = ["Sam iPhone", "Kate Pixel"]   # NetworkManager profiles with these names must exist
tunnel_base = "10.66.0.1"   # the base's address inside the WireGuard tunnel
wg_iface = "convoy"         # /etc/wireguard/convoy.conf (deploy/wg/bike.conf.example)
fail_s = 8
restore_s = 12
